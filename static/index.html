<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpHive Support Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7L4 23V9z' fill='%23ffd166'/%3E%3Cpath d='M12 12h2v8h-2zm6 0h2v8h-2zm-6 3h8v2h-8z' fill='%230b0f14'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #080b10;
    --window: #0e141c;
    --window-2: #121a24;
    --line: #213041;
    --text: #d9e4f2;
    --dim: #8190a6;
    --green: #3ddc84;
    --cyan: #4dd0e1;
    --magenta: #d58cff;
    --yellow: #ffd166;
    --blue: #74a9ff;
    --red: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(900px 400px at 20% -10%, rgba(116, 169, 255, .10), transparent 60%),
      radial-gradient(700px 360px at 100% 0%, rgba(213, 140, 255, .08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
  }

  /* pattern colors, used through --c */
  .p1 { --c: var(--cyan); }
  .p2 { --c: var(--magenta); }
  .p3 { --c: var(--yellow); }
  .p4 { --c: var(--green); }
  .p5 { --c: var(--blue); }
  .p6 { --c: var(--red); }

  .shell {
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 236px;
    gap: 16px;
  }

  /* ---------- terminal window ---------- */
  .term {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--window);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .65);
    overflow: hidden;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: var(--window-2);
    border-bottom: 1px solid var(--line);
  }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; }
  .bar i:nth-child(3) { background: #28c840; }
  .bar span { margin: 0 auto; padding-right: 42px; color: var(--dim); font-size: 12px; letter-spacing: .02em; }

  .screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 20px 8px;
    scroll-behavior: smooth;
  }
  .screen::-webkit-scrollbar { width: 10px; }
  .screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--window); }

  /* ---------- hero ---------- */
  .hero h1 { margin: 0 0 4px; font-size: 30px; line-height: 1.2; letter-spacing: -.01em; }
  .hero h1 b { color: var(--yellow); }
  .cursor { display: inline-block; width: .55em; height: 1em; background: var(--green); vertical-align: -0.12em; margin-left: 6px; animation: blink 1.1s steps(1) infinite; }
  .dim { color: var(--dim); }
  .hero p { margin: 4px 0; }

  .chips { display: grid; gap: 8px; margin: 14px 0 6px; }
  .chip {
    font: inherit;
    color: var(--text);
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    transition: border-color .15s, background .15s;
  }
  .chip kbd { color: var(--green); font: inherit; font-weight: 700; }
  .chip:hover:not(:disabled) { border-color: var(--green); background: rgba(61, 220, 132, .06); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- echoed input ---------- */
  .echo { margin: 18px 0 6px; display: flex; gap: 10px; }
  .echo .who { font-weight: 700; flex: none; }
  .echo.ticket .who { color: var(--green); }
  .echo.you .who { color: var(--red); }
  .echo .said { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---------- pattern header and steps ---------- */
  .rule {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 6px;
    color: var(--c);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    animation: rise .25s ease-out both;
  }
  .rule::after { content: ""; flex: 1; border-top: 1px solid var(--c); opacity: .35; }

  .step {
    display: grid;
    grid-template-columns: 54px 118px minmax(0, 1fr);
    gap: 0 10px;
    padding: 1px 0;
    animation: rise .25s ease-out both;
  }
  .step .tag { color: var(--c); font-weight: 700; }
  .step .node { font-weight: 700; }
  .step .detail { color: var(--dim); overflow-wrap: anywhere; }
  .step .ok { color: var(--green); font-weight: 700; }
  .step .no { color: var(--yellow); font-weight: 700; }

  /* ---------- cards ---------- */
  .card {
    margin: 12px 0 14px;
    border: 1px solid var(--c, var(--line));
    border-radius: 10px;
    background: rgba(255, 255, 255, .02);
    animation: rise .3s ease-out both;
    overflow: hidden;
  }
  .card > header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    background: color-mix(in srgb, var(--c, var(--line)) 14%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--c, var(--line)) 40%, transparent);
    font-weight: 700;
    color: var(--c, var(--text));
  }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .card .body { padding: 12px 14px; }

  .meta { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 2px 12px; margin: 0 0 10px; }
  .meta dt { color: var(--dim); }
  .meta dd { margin: 0; overflow-wrap: anywhere; }

  .scores { display: grid; gap: 4px; margin-bottom: 12px; }
  .score { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; gap: 12px; align-items: center; }
  .score .name { color: var(--dim); }
  .score .track { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .score .fill { height: 100%; border-radius: 4px; background: var(--green); }
  .score .fill.warn { background: var(--yellow); }
  .score .fill.bad { background: var(--red); }
  .score .num { text-align: right; }

  .draft {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 10px;
  }
  .hint { color: var(--dim); margin: 0 0 10px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font: inherit;
    font-weight: 700;
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
  }
  .btn.approve { color: #04210f; background: var(--green); border-color: var(--green); }
  .btn.approve:hover:not(:disabled) { filter: brightness(1.1); }
  .btn.changes:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .card.sent { --c: var(--green); }
  .card.escalated, .card.error { --c: var(--red); }
  .card .reply { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---------- prompt ---------- */
  .prompt {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--window-2);
  }
  .prompt:focus-within { box-shadow: inset 0 2px 0 var(--green); }
  .prompt.review:focus-within { box-shadow: inset 0 2px 0 var(--red); }
  .prompt label { font-weight: 700; color: var(--green); white-space: nowrap; }
  .prompt.review label { color: var(--red); }
  .prompt.busy label { color: var(--dim); }
  .prompt.busy label::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  .prompt input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    caret-color: var(--green);
  }
  .prompt input::placeholder { color: #5d6b80; }
  .prompt .send {
    font: inherit;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 10px;
    cursor: pointer;
  }
  .prompt .send:hover:not(:disabled) { color: var(--text); border-color: var(--dim); }
  .prompt .send:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- sidebar ---------- */
  .side {
    min-height: 0;
    overflow-y: auto;
    background: var(--window);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .side h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 700; }
  .side ol { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 6px; }
  .side li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--dim);
    transition: color .2s, border-color .2s, background .2s;
  }
  .side .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--c); opacity: .55; flex: none; }
  .side .pn { font-weight: 700; color: var(--c); }
  .side li.done { color: var(--text); }
  .side li.done .dot { background: var(--c); opacity: 1; }
  .side li.active { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .side li.active .dot { background: var(--c); opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .side p { margin: 0 0 10px; color: var(--dim); font-size: 12px; line-height: 1.55; }
  .side .thread { font-size: 12px; color: var(--dim); }
  .side .thread b { color: var(--text); font-weight: 400; }

  /* ---------- motion ---------- */
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto !important; transition: none !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 10px; }
    .side { order: -1; padding: 10px; overflow: visible; }
    .side h2, .side p, .side .thread { display: none; }
    .side ol { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; gap: 4px; }
    .side li { padding: 4px 6px; font-size: 11px; gap: 6px; }
    .side .label { display: none; }
    .step { grid-template-columns: 46px minmax(0, 1fr); }
    .step .detail { grid-column: 2; }
    .score, .meta { grid-template-columns: 72px minmax(0, 1fr) 40px; }
    .meta { grid-template-columns: 72px minmax(0, 1fr); }
    .screen { padding: 14px 12px 6px; }
    .prompt { padding: 10px 12px; }
    .prompt input { font-size: 16px; }
    .hero h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="shell">

  <main class="term" aria-label="HelpHive terminal">
    <header class="bar">
      <i></i><i></i><i></i>
      <span>helphive &mdash; support-desk &mdash; 6 patterns</span>
    </header>

    <div class="screen" id="screen" role="log" aria-live="polite" aria-label="Terminal output"></div>

    <form class="prompt" id="form" autocomplete="off">
      <label for="input" id="label">ticket &gt;</label>
      <input id="input" type="text" placeholder="paste a ticket, press Enter" spellcheck="false" maxlength="2000" autofocus>
      <button class="send" id="send" type="submit">Enter</button>
    </form>
  </main>

  <aside class="side" aria-label="Pattern progress">
    <h2>PATTERNS</h2>
    <ol id="patterns"></ol>

    <h2>HOW IT WORKS</h2>
    <p>Each finished graph node prints a line. The pattern it belongs to lights up here.</p>
    <p>At Pattern 6 the graph pauses and waits for you.</p>
    <div class="thread">thread&nbsp;<b id="thread">&mdash;</b></div>
  </aside>

</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const screen = $('screen'), form = $('form'), input = $('input'), label = $('label'), send = $('send');
  const patternList = $('patterns');

  let mode = 'ticket';          // 'ticket' or 'review' (waiting for the human)
  let busy = false;
  let threadId = null;
  let headerPattern = null;     // last pattern header printed
  let reviewCard = null;
  const seen = new Set();
  let samples = {};

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function add(node) {
    screen.appendChild(node);
    screen.scrollTop = screen.scrollHeight;
    return node;
  }

  /* ---------- sidebar ---------- */
  function buildSidebar(patterns) {
    patternList.replaceChildren();
    const short = { 1: 'Sequential', 2: 'Parallel', 3: 'Routing', 4: 'RAG', 5: 'Loop + tools', 6: 'Human loop' };
    patterns.forEach((p) => {
      const li = el('li', 'p' + p.n);
      li.dataset.p = p.n;
      li.append(el('span', 'dot'), el('span', 'pn', 'P' + p.n), el('span', 'label', short[p.n] || p.name));
      patternList.appendChild(li);
    });
  }

  function paintSidebar(active) {
    patternList.querySelectorAll('li').forEach((li) => {
      const n = Number(li.dataset.p);
      li.classList.toggle('active', n === active);
      li.classList.toggle('done', n !== active && seen.has(n));
    });
  }

  function resetPatterns() {
    seen.clear();
    headerPattern = null;
    paintSidebar(null);
  }

  /* ---------- prompt state ---------- */
  function syncPrompt() {
    form.classList.toggle('busy', busy);
    form.classList.toggle('review', mode === 'review' && !busy);
    input.disabled = busy;
    send.disabled = busy;
    screen.querySelectorAll('.chip').forEach((c) => { c.disabled = busy || mode !== 'ticket'; });

    if (busy) {
      label.textContent = 'running';
      input.placeholder = 'the graph is running';
    } else if (mode === 'review') {
      label.textContent = 'you >';
      input.placeholder = 'approve, or write feedback';
    } else {
      label.textContent = 'ticket >';
      input.placeholder = 'paste a ticket, press Enter';
    }
    if (!busy) input.focus({ preventScroll: true });
  }

  /* ---------- printing ---------- */
  function hero() {
    const box = el('section', 'hero');
    const h1 = el('h1');
    h1.append('Help', Object.assign(el('b'), { textContent: 'Hive' }), el('span', 'cursor'));
    box.append(
      h1,
      el('p', null, 'Customer support desk built on 6 LangGraph patterns.'),
      el('p', 'dim', 'An AI drafts the reply, an AI reviewer checks it, then you approve it before it is sent.')
    );

    const chips = el('div', 'chips');
    Object.entries(samples).forEach(([key, text]) => {
      const chip = el('button', 'chip');
      chip.type = 'button';
      chip.append(el('kbd', null, key), el('span', null, text));
      chip.addEventListener('click', () => { if (!busy && mode === 'ticket') submit(text); });
      chips.appendChild(chip);
    });
    box.append(chips, el('p', 'dim', 'Click a sample, or type your own ticket below. Type "clear" to wipe the screen.'));
    add(box);
  }

  function echo(who, text) {
    const row = el('div', 'echo ' + who);
    row.append(el('span', 'who', who === 'ticket' ? 'ticket >' : 'you >'), el('span', 'said', text));
    add(row);
  }

  function showStep(ev) {
    seen.add(ev.pattern);
    paintSidebar(ev.pattern);

    if (ev.pattern !== headerPattern) {
      headerPattern = ev.pattern;
      add(el('div', 'rule p' + ev.pattern, 'Pattern ' + ev.pattern + ' · ' + ev.name));
    }

    const row = el('div', 'step p' + ev.pattern);
    const detail = el('span', 'detail');

    const verdict = ev.node === 'reviewer' ? ev.detail.match(/^(APPROVED|REJECTED)( - )?(.*)$/) : null;
    if (verdict) {
      detail.append(el('span', verdict[1] === 'APPROVED' ? 'ok' : 'no', verdict[1]), ' ' + verdict[3]);
    } else {
      detail.textContent = ev.detail;
    }
    row.append(el('span', 'tag', 'done'), el('span', 'node', ev.node), detail);
    add(row);
  }

  function showReview(data) {
    seen.add(6);
    paintSidebar(6);
    if (headerPattern !== 6) {
      headerPattern = 6;
      add(el('div', 'rule p6', 'Pattern 6 · HUMAN IN THE LOOP'));
    }

    const card = el('section', 'card p6');
    const head = el('header');
    head.append(el('span', null, 'Draft reply'), el('span', 'badge', 'waiting for you'));

    const body = el('div', 'body');
    const meta = el('dl', 'meta');
    [['Summary', data.summary], ['Category', data.category],
     ['AI reviewer', data.ai_approved ? 'approved' : 'not approved (max tries reached)']].forEach(([k, v]) => {
      meta.append(el('dt', null, k), el('dd', null, v));
    });

    const scores = el('div', 'scores');
    Object.entries(data.scores || {}).forEach(([name, value]) => {
      const row = el('div', 'score');
      const track = el('div', 'track');
      const fill = el('div', 'fill' + (value >= 67 ? ' bad' : value >= 34 ? ' warn' : ''));
      fill.style.width = Math.max(0, Math.min(100, value)) + '%';
      track.appendChild(fill);
      row.append(el('span', 'name', name), track, el('span', 'num', value + '/100'));
      scores.appendChild(row);
    });

    const actions = el('div', 'actions');
    const approve = el('button', 'btn approve', 'approve');
    const changes = el('button', 'btn changes', 'request changes');
    approve.type = changes.type = 'button';
    approve.addEventListener('click', () => { if (!busy) submit('approve'); });
    changes.addEventListener('click', () => { input.focus(); });
    actions.append(approve, changes);

    body.append(meta, scores, el('div', 'draft', data.draft), el('p', 'hint', data.instruction), actions);
    card.append(head, body);
    reviewCard = card;
    add(card);
  }

  function lockReview() {
    if (!reviewCard) return;
    reviewCard.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    const badge = reviewCard.querySelector('.badge');
    if (badge) badge.textContent = 'answered';
    reviewCard = null;
  }

  function showDone(ev) {
    paintSidebar(null);
    const sent = ev.status === 'SENT';
    const card = el('section', 'card ' + (sent ? 'sent' : 'escalated'));
    const head = el('header');
    head.append(el('span', null, sent ? 'SENT to customer' : 'ESCALATED'), el('span', 'badge', ev.status || ''));
    const body = el('div', 'body');
    body.appendChild(el('div', 'reply', sent ? ev.reply : 'Rejected twice. The ticket was handed to a senior agent.'));
    card.append(head, body);
    add(card);
    add(el('p', 'dim', 'Ready for the next ticket.'));
  }

  function showError(message) {
    const card = el('section', 'card error');
    const head = el('header');
    head.append(el('span', null, 'Something went wrong'));
    const body = el('div', 'body');
    body.append(el('div', 'reply', message), el('p', 'hint', 'Check GROQ_API_KEY in .env, then try the ticket again.'));
    card.append(head, body);
    add(card);
  }

  /* ---------- talking to the server ---------- */
  function handle(ev) {
    if (ev.type === 'start') {
      threadId = ev.thread_id;
      $('thread').textContent = threadId.slice(0, 8);
    } else if (ev.type === 'step') {
      showStep(ev);
    } else if (ev.type === 'pause') {
      mode = 'review';
      showReview(ev.data);
    } else if (ev.type === 'done') {
      mode = 'ticket';
      showDone(ev);
    } else if (ev.type === 'error') {
      mode = 'ticket';
      lockReview();
      paintSidebar(null);
      showError(ev.message);
    }
  }

  async function stream(url, body) {
    busy = true;
    syncPrompt();
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok || !res.body) throw new Error('Server answered ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, cut).trim();
          buffer = buffer.slice(cut + 1);
          if (line) handle(JSON.parse(line));
        }
      }
    } catch (err) {
      mode = 'ticket';
      showError(err.message || String(err));
    } finally {
      busy = false;
      syncPrompt();
    }
  }

  function submit(text) {
    if (mode === 'ticket') {
      if (text.toLowerCase() === 'clear') {
        screen.replaceChildren();
        resetPatterns();
        hero();
        syncPrompt();
        return;
      }
      resetPatterns();
      echo('ticket', text);
      stream('/api/run', { ticket: text });
    } else {
      lockReview();
      echo('you', text);
      stream('/api/resume', { thread_id: threadId, answer: text });
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (busy || !text) return;
    input.value = '';
    submit(text);
  });

  /* ---------- start ---------- */
  fetch('/api/meta')
    .then((r) => r.json())
    .then((meta) => {
      samples = meta.samples || {};
      buildSidebar(meta.patterns || []);
      hero();
      syncPrompt();
    })
    .catch(() => {
      hero();
      showError('Cannot reach the HelpHive server. Start it with: python server.py');
    });
})();
</script>
